name: msna-template-validation

on:
  push:
    paths:
      - "inst/extdata/form.xlsx"
  pull_request:
    paths:
      - "inst/extdata/form.xlsx"
  workflow_dispatch:
    inputs:
      xlsform_path:
        description: "Path to the XLSForm file"
        default: "inst/extdata/form.xlsx"
        required: false

env:
  XLSFORM_PATH: ${{ inputs.xlsform_path || 'inst/extdata/form.xlsx' }}
  UV_LINK_MODE: copy

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate form.xlsx with pyxform
        run: uv run python tools/validate_xlsform.py "$XLSFORM_PATH"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::openxlsx2
          needs: Imports

      - name: Trim form and check other_ coverage
        run: REQUIRED_FORM_PATH="$RUNNER_TEMP/form_required.xlsx" Rscript tools/trim_xlsform.R

      - name: Validate form_required.xlsx with pyxform
        run: uv run python tools/validate_xlsform.py "$RUNNER_TEMP/form_required.xlsx"

      - name: Regenerate msna_template_required
        run: |
          echo "::group::devtools output"
          Rscript -e "devtools::load_all(); source('data-raw/msna_template_required.R')"
          echo "::endgroup::"

      - name: Check generated data in sync with form.xlsx
        run: |
          if ! git diff --exit-code data/; then
            echo "::error::Generated data is out of sync with form.xlsx. Run 'just data' locally and commit the result."
            exit 1
          fi
