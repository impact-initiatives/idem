name: "Release"
description: "Checklist to cut a new idem release"
title: "Release v<YYYY.M.D>"
labels: release

body:
  - type: markdown
    attributes:
      value: |
        ## Before you start

        idem uses **CalVer** — the version is the release date: `YYYY.M.D` (no zero-padding).
        Example: a release on 5 May 2026 → `v2026.5.5`.

        Fill in the target version below, then work through the checklist in order.
        Each section must be fully ticked before moving to the next.

  - type: input
    id: version
    attributes:
      label: "Target version"
      description: "The version string that will appear in DESCRIPTION, NEWS.md, and the git tag."
      placeholder: "2026.5.5"
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: "Release checklist"
      value: |
        ### 1 · Open this issue and create the release branch

        - [ ] Open this issue first — you need its number for the next step
        - [ ] Create `release/v<VERSION>` linked to this issue and check it out
              ```sh
              gh issue develop <ISSUE_NUMBER> \
                --name release/v<VERSION> \
                --base main \
                --checkout
              ```
              This creates the branch on GitHub, links it to the issue's Development panel, and checks it out locally.
              (`usethis::pr_init()` creates a branch too but cannot link it to an issue — use `gh` here.)

        ---

        ### 2 · Bump the version and update the changelog

        - [ ] Set the version in `DESCRIPTION` (CalVer: today's date, no zero-padding)
              ```r
              desc::desc_set_version("<VERSION>")
              ```
        - [ ] Generate the `NEWS.md` entry from conventional commits
              ```sh
              just news <VERSION>
              ```
              Prepends a `# idem <VERSION>` section to `NEWS.md` grouped by type.
              Commits with scope `form.xlsx` are pulled into a dedicated **MSNA template** section at the top.
              Review and edit the draft before committing — cliff output is a starting point, not final copy.
        - [ ] Commit: `chore(release): bump version to <VERSION>`

        ---

        ### 3 · Polish and verify

        - [ ] Regenerate documentation
              ```r
              devtools::document()
              ```
        - [ ] Run R CMD check — **0 errors, 0 warnings, 0 notes** required
              ```r
              devtools::check()
              ```
        - [ ] Rebuild `README.md` if `README.Rmd` has changed
              ```r
              devtools::build_readme()
              ```
        - [ ] Preview the pkgdown site locally
              ```r
              pkgdown::build_site()
              ```
        - [ ] Commit any changes from the steps above

        ---

        ### 4 · Open the pull request

        - [ ] Push and open a PR targeting `main`
              ```r
              usethis::pr_push()
              ```
              Set the PR title to `chore(release): idem v<VERSION>`
        - [ ] All CI checks pass (R CMD check, lint, format)
        - [ ] At least one maintainer has reviewed the PR
        - [ ] Merge into `main` — **merge commit, not squash** (preserves individual conventional commits)

        ---

        ### 5 · Tag and publish

        - [ ] Pull `main` and create an annotated tag
              ```sh
              git checkout main && git pull
              git tag -a v<VERSION> -m "idem v<VERSION>"
              git push origin v<VERSION>
              ```
        - [ ] Create the GitHub Release from the tag with the `NEWS.md` section as the body
              ```sh
              gh release create v<VERSION> \
                --title "idem v<VERSION>" \
                --draft
              ```
              Opens a draft release in the browser — paste the `# idem <VERSION>` section from `NEWS.md` as the body, then publish.
        - [ ] Confirm the pkgdown GitHub Pages deploy succeeded (Actions tab)

        ---

        ### 6 · Post-release

        - [ ] Close this issue
        - [ ] Announce in the team channel if applicable
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Notes / blockers"
      description: "Anything unusual about this release — breaking changes, outstanding PRs, known issues."
